<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Site analytics</title>
<style>
:root{--paper:#faf8f3;--card:#fff;--ink:#1d1b18;--muted:#6d675e;--line:#e6e1d6;--accent:#2f6f5e;--accent2:#c2703d;--bar:#2f6f5e33}
@media (prefers-color-scheme:dark){:root{--paper:#161513;--card:#1f1d1a;--ink:#ece8df;--muted:#a39d92;--line:#33302b;--accent:#6cc2a7;--accent2:#e39a62;--bar:#6cc2a733}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:18px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1rem;margin:0 0 10px}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ctrl button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.ctrl button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ctrl label{font-size:.85rem;color:var(--muted);margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.82rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.empty{color:var(--muted);font-size:.88rem}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:4px}
.pill.lead{border-color:var(--accent2);color:var(--accent2)}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:6px}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.bars div i{position:absolute;left:0;right:0;bottom:0;background:var(--accent2);border-radius:3px 3px 0 0}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;margin-top:4px}
.depth{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--bar);vertical-align:middle;margin-right:6px;overflow:hidden}
.depth i{display:block;height:100%;background:var(--accent)}
code{font-size:.85em}
button.copy{font:inherit;font-size:.75rem;border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:1px 6px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Site analytics</h1>
  <div class="ctrl" id="ctrl">
    <button data-d="1">Today</button><button data-d="7">7 days</button><button data-d="30" class="on">30 days</button><button data-d="90">90 days</button><button data-d="0">All</button>
    <label><input type="checkbox" id="own"> include my own visits</label>
  </div>
</header>
<div class="tiles" id="tiles"></div>
<div class="card"><h2>Visitors per day <span class="muted" style="font-weight:400">· orange: contact form sent</span></h2><div id="daily"></div></div>
<div class="card"><h2>Where visits come from</h2><div id="sources"></div></div>
<div class="card"><h2>Short links</h2><div id="links"></div></div>
<div class="grid2">
  <div class="card"><h2>Campaigns (UTM)</h2><div id="campaigns"></div></div>
  <div class="card"><h2>Referring sites</h2><div id="referrers"></div></div>
</div>
<div class="card"><h2>Pages, and how far people read</h2><div id="pages"></div></div>
<div class="grid2">
  <div class="card"><h2>Devices</h2><div id="devices"></div></div>
  <div class="card"><h2>Languages</h2><div id="languages"></div></div>
</div>
<div class="card"><h2>Latest visits</h2><div id="recent"></div></div>
<p class="muted" id="foot"></p>
</div>
<script>
var days = 30;
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var pct = function (a, b) { return b ? Math.round(100 * a / b) + '%' : ''; };
var dur = function (s) { if (s == null) return ''; return s < 60 ? s + 's' : Math.round(s / 60) + 'm'; };
var bar = function (d) { return d == null ? '<span class="muted">no data</span>' : '<span class="depth"><i style="width:' + d + '%"></i></span>' + d + '%'; };
function table(rows, cols, empty) {
  if (!rows.length) return '<p class="empty">' + (empty || 'Nothing yet.') + '</p>';
  return '<table><tr>' + cols.map(function (c) { return '<th class="' + (c.n ? 'n' : '') + '">' + c.h + '</th>'; }).join('') + '</tr>' +
    rows.map(function (r) { return '<tr>' + cols.map(function (c) { return '<td class="' + (c.n ? 'n' : '') + '">' + c.f(r) + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
}
var groupCols = function (label) { return [
  {h: label, f: function (r) { return esc(r.key); }},
  {h: 'Visits', n: 1, f: function (r) { return r.visits; }},
  {h: 'Visitors', n: 1, f: function (r) { return r.visitors; }},
  {h: 'Pages / visit', n: 1, f: function (r) { return r.pages_per_visit; }},
  {h: 'Reached contact', n: 1, f: function (r) { return r.reached_contact + ' <span class="muted">' + pct(r.reached_contact, r.visits) + '</span>'; }},
  {h: 'Form sent', n: 1, f: function (r) { return r.leads; }}
]; };
function render(s) {
  var t = s.totals;
  $('tiles').innerHTML = [
    ['Visitors', t.visitors], ['New visitors', t.new_visitors], ['Visits', t.visits], ['Page views', t.views],
    ['Short link clicks', t.link_clicks], ['Forms sent', t.leads]
  ].map(function (x) { return '<div class="tile"><b>' + x[1] + '</b><span>' + x[0] + '</span></div>'; }).join('');
  var max = Math.max.apply(null, s.daily.map(function (d) { return d.visitors; }).concat([1]));
  $('daily').innerHTML = s.daily.length ? '<div class="bars">' + s.daily.map(function (d) {
      return '<div title="' + d.date + ': ' + d.visitors + ' visitors, ' + d.views + ' views, ' + d.leads + ' forms" style="height:' + (100 * d.visitors / max) + '%"><i style="height:' + (d.visitors ? 100 * Math.min(d.leads, d.visitors) / d.visitors : 0) + '%"></i></div>';
    }).join('') + '</div><div class="axis"><span>' + s.daily[0].date + '</span><span>most: ' + max + ' a day</span><span>' + s.daily[s.daily.length - 1].date + '</span></div>'
    : '<p class="empty">No visits in this period.</p>';
  $('sources').innerHTML = table(s.sources, groupCols('Source'));
  $('campaigns').innerHTML = table(s.campaigns, groupCols('source · medium · campaign · content'), 'No tagged visits yet.');
  $('referrers').innerHTML = table(s.referrers, groupCols('Site'), 'No outside referrers yet.');
  $('links').innerHTML = table(s.links, [
    {h: 'Link', f: function (r) { return '<code>/' + esc(r.slug) + '</code> <button class="copy" data-u="' + esc(r.url) + '">copy</button>' + (r.note ? '<br><span class="muted">' + esc(r.note) + '</span>' : ''); }},
    {h: 'UTM', f: function (r) { return esc([r.utm_source, r.utm_medium, r.utm_campaign, r.utm_content, r.utm_term].filter(Boolean).join(' · ')); }},
    {h: 'Clicks', n: 1, f: function (r) { return r.clicks + (r.previews ? ' <span class="muted" title="link previews by apps and bots, not counted">+' + r.previews + '</span>' : ''); }},
    {h: 'Visits', n: 1, f: function (r) { return r.visits; }},
    {h: 'Reached contact', n: 1, f: function (r) { return r.reached_contact; }},
    {h: 'Form sent', n: 1, f: function (r) { return r.leads; }},
    {h: 'Made', f: function (r) { return r.created; }}
  ], 'No short links yet. Ask Claude to make one.');
  $('pages').innerHTML = table(s.pages, [
    {h: 'Page', f: function (r) { return esc(r.path); }},
    {h: 'Views', n: 1, f: function (r) { return r.views; }},
    {h: 'Visitors', n: 1, f: function (r) { return r.visitors; }},
    {h: 'Typical depth read', f: function (r) { return bar(r.median_depth); }},
    {h: 'Typical time', n: 1, f: function (r) { return dur(r.median_secs); }}
  ]);
  var kv = function (rows) { var tot = rows.reduce(function (a, r) { return a + r[1]; }, 0);
    return table(rows, [{h: '', f: function (r) { return esc(r[0]); }}, {h: 'Visits', n: 1, f: function (r) { return r[1] + ' <span class="muted">' + pct(r[1], tot) + '</span>'; }}]); };
  $('devices').innerHTML = kv(s.devices);
  $('languages').innerHTML = kv(s.languages);
  $('recent').innerHTML = table(s.recent, [
    {h: 'When (UTC)', f: function (r) { return r.start.replace('T', ' ').slice(5, 16) + (r.minutes ? '<br><span class="muted">' + r.minutes + ' min</span>' : ''); }},
    {h: 'From', f: function (r) { return esc(r.source) + (r.campaign ? '<br><span class="muted">' + esc(r.campaign) + '</span>' : '') + (r.link ? '<br><span class="muted">/' + esc(r.link) + '</span>' : ''); }},
    {h: 'Pages', f: function (r) { return r.pages.map(function (p) { return esc(p) + (r.depth[p] != null ? ' <span class="muted">' + r.depth[p] + '%</span>' : ''); }).join(' → '); }},
    {h: '', f: function (r) { return esc(r.device || '') + (r.new ? '<span class="pill">new</span>' : '<span class="pill">returning</span>') + (r.lead ? '<span class="pill lead">form sent</span>' : ''); }}
  ]);
  $('foot').textContent = 'Updated ' + s.generated.replace('T', ' ').slice(0, 16) + ' UTC. ' + (s.include_own ? 'Includes' : 'Leaves out') + ' visits from your own addresses. Link previews by apps and bots are not counted as clicks.';
}
function load() {
  fetch('/api/stats?days=' + days + ($('own').checked ? '&own=1' : ''), {cache: 'no-store'})
    .then(function (r) { return r.json(); }).then(render)
    .catch(function () { $('foot').textContent = 'Could not load the numbers.'; });
}
$('ctrl').addEventListener('click', function (e) {
  if (e.target.dataset.d == null) return;
  days = +e.target.dataset.d;
  [].forEach.call($('ctrl').querySelectorAll('button'), function (b) { b.classList.toggle('on', b === e.target); });
  load();
});
$('own').addEventListener('change', load);
document.addEventListener('click', function (e) {
  if (e.target.classList.contains('copy')) { navigator.clipboard.writeText(e.target.dataset.u); e.target.textContent = 'copied'; }
});
load();
</script>
</body>
</html>
